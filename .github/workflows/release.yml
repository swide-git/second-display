name: Build & Release

# Pull requests: unit tests + debug APK artifact.
# Push to main:  automatic release. The next version is the newest vX.Y.Z tag with the
#                patch bumped (#minor / #major in the merge message bump those instead;
#                [skip release] builds and tests without publishing). The tag and the
#                GitHub Release are created by this run: tags pushed with GITHUB_TOKEN do
#                not trigger another workflow run.
# Tag vX.Y.Z:    manual release of that exact tag.
# (Gitea uses .gitea/workflows/ instead; it takes precedence there.)

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: 27.3.13750724
      KEYSTORE_BASE64: ${{ secrets.SECOND_DISPLAY_KEYSTORE_BASE64 }}
      # Job-wide: once SECOND_DISPLAY_KEYSTORE_PATH is set, every Gradle invocation needs the full signing config.
      SECOND_DISPLAY_KEYSTORE_PASSWORD: ${{ secrets.SECOND_DISPLAY_KEYSTORE_PASSWORD }}
      SECOND_DISPLAY_KEY_ALIAS: ${{ secrets.SECOND_DISPLAY_KEY_ALIAS }}
      SECOND_DISPLAY_KEY_PASSWORD: ${{ secrets.SECOND_DISPLAY_KEY_PASSWORD }}
    steps:
      - name: Check out (full history and tags for versioning)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install Android platform, NDK and CMake
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null || true
          "$sdkmanager" --install "platforms;android-35" "ndk;$NDK_VERSION" "cmake;3.22.1" > /dev/null

      - name: Compute version
        run: |
          scripts/version.sh | tee -a "$GITHUB_ENV"

      - name: Decide automatic release
        id: auto
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          msg="$(git log -1 --format=%B "$GITHUB_SHA")"
          if git tag --points-at "$GITHUB_SHA" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Commit already has a release tag; its tag run publishes it."
            echo "publish=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if grep -qiF '[skip release]' <<<"$msg"; then
            echo "[skip release] in the commit message: build and test only."
            echo "publish=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          last="$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' 2>/dev/null || echo v0.0.0)"
          IFS=. read -r major minor patch <<<"${last#v}"
          if grep -qiF '#major' <<<"$msg"; then major=$((major + 1)); minor=0; patch=0
          elif grep -qiF '#minor' <<<"$msg"; then minor=$((minor + 1)); patch=0
          else patch=$((patch + 1)); fi
          if (( minor > 99 || patch > 99 )); then
            echo "::error::minor and patch must stay <= 99 (versionCode scheme)"; exit 1
          fi
          echo "Releasing v$major.$minor.$patch (previous $last)"
          echo "SECOND_DISPLAY_VERSION_NAME=$major.$minor.$patch" >> "$GITHUB_ENV"
          echo "SECOND_DISPLAY_VERSION_CODE=$(( major * 1000000 + minor * 10000 + patch * 100 ))" >> "$GITHUB_ENV"
          echo "tag=v$major.$minor.$patch" >> "$GITHUB_OUTPUT"
          echo "publish=true" >> "$GITHUB_OUTPUT"

      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tags must look like v1.2.3 (got $GITHUB_REF_NAME)"
            exit 1
          fi
          if [ "v$SECOND_DISPLAY_VERSION_NAME" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Computed version $SECOND_DISPLAY_VERSION_NAME does not match tag $GITHUB_REF_NAME"
            exit 1
          fi

      - name: Require signing secrets for published builds
        if: github.event_name == 'push'
        run: |
          missing=""
          [ -n "$KEYSTORE_BASE64" ] || missing="$missing SECOND_DISPLAY_KEYSTORE_BASE64"
          [ -n "$SECOND_DISPLAY_KEYSTORE_PASSWORD" ] || missing="$missing SECOND_DISPLAY_KEYSTORE_PASSWORD"
          [ -n "$SECOND_DISPLAY_KEY_ALIAS" ] || missing="$missing SECOND_DISPLAY_KEY_ALIAS"
          [ -n "$SECOND_DISPLAY_KEY_PASSWORD" ] || missing="$missing SECOND_DISPLAY_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing; refusing to publish an unsigned build."
            exit 1
          fi

      - name: Decode release keystore
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "SECOND_DISPLAY_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Build APK and App Bundle
        run: |
          mkdir -p dist
          if [ -n "${SECOND_DISPLAY_KEYSTORE_PATH:-}" ]; then
            # The signed .aab is what Google Play takes; the .apk is for sideloading.
            ./gradlew --no-daemon :app:assembleRelease :app:bundleRelease
            cp app/build/outputs/apk/release/app-release.apk dist/second-display.apk
            cp app/build/outputs/bundle/release/app-release.aab dist/second-display.aab
            (cd dist && sha256sum second-display.aab > second-display.aab.sha256)
          else
            ./gradlew --no-daemon :app:assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk dist/second-display.apk
          fi
          (cd dist && sha256sum second-display.apk > second-display.apk.sha256)
          cat dist/*.sha256

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: second-display-${{ env.SECOND_DISPLAY_VERSION_NAME }}
          path: dist/second-display.*

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/second-display.* \
            --verify-tag --generate-notes \
            --title "Second Display $GITHUB_REF_NAME"

      - name: Publish automatic release
        if: steps.auto.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.auto.outputs.tag }}
        run: |
          # The rolling "latest" pre-release is retired; remove it if it is still there.
          gh release delete latest --cleanup-tag --yes 2>/dev/null || true
          gh release create "$TAG" dist/second-display.* \
            --target "$GITHUB_SHA" --generate-notes \
            --title "Second Display $TAG"
